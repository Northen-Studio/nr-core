name: Verify Lua resource
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install development Lua runtime
        run: npm install --prefix .test-tools --no-audit --no-fund wasmoon@1.16.0
      - name: Compile and test both runtimes
        run: node tests/run.cjs
